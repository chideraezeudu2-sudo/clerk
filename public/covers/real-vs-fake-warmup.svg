<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2414"/>
      <stop offset="1" stop-color="#103823"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg7)"/>

  <!-- Real side (top): one mailbox, one human, real line -->
  <g transform="translate(730, 110)">
    <rect width="420" height="190" rx="16" fill="#1ad379" fill-opacity="0.10" stroke="#1ad379" stroke-opacity="0.55"/>
    <text x="24" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#1ad379">REAL WARMUP</text>
    <!-- mailbox -->
    <rect x="24" y="64" width="52" height="40" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#baf3d2" stroke-opacity="0.6"/>
    <polyline points="28,72 50,90 72,72" stroke="#baf3d2" stroke-width="2.5" fill="none"/>
    <!-- human -->
    <circle cx="380" cy="76" r="13" fill="#baf3d2"/>
    <rect x="364" y="92" width="32" height="26" rx="10" fill="#baf3d2"/>
    <!-- connection -->
    <path d="M 96 86 C 200 70, 280 70, 344 80" stroke="#1ad379" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="96" cy="86" r="4.5" fill="#1ad379"/>
    <circle cx="344" cy="80" r="4.5" fill="#1ad379"/>
    <text x="24" y="150" font-family="system-ui, sans-serif" font-size="14.5" fill="#baf3d2" fill-opacity="0.85">Actual emails, actual people, slow ramp</text>
    <!-- ramp bars -->
    <rect x="24" y="160" width="10" height="14" rx="2" fill="#1ad379" fill-opacity="0.35"/>
    <rect x="42" y="156" width="10" height="18" rx="2" fill="#1ad379" fill-opacity="0.5"/>
    <rect x="60" y="150" width="10" height="24" rx="2" fill="#1ad379" fill-opacity="0.65"/>
    <rect x="78" y="142" width="10" height="32" rx="2" fill="#1ad379" fill-opacity="0.8"/>
    <rect x="96" y="132" width="10" height="42" rx="2" fill="#1ad379"/>
  </g>

  <!-- Fake side (bottom): tangled scripted web -->
  <g transform="translate(730, 350)">
    <rect width="420" height="190" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#e07070" stroke-opacity="0.35"/>
    <text x="24" y="38" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#e07070">FAKE NETWORK</text>
    <!-- tangled script web -->
    <g stroke="#e07070" stroke-opacity="0.5" stroke-width="1.5">
      <circle cx="60" cy="95" r="8" fill="#e07070" fill-opacity="0.6"/>
      <circle cx="130" cy="70" r="8" fill="#e07070" fill-opacity="0.6"/>
      <circle cx="200" cy="105" r="8" fill="#e07070" fill-opacity="0.6"/>
      <circle cx="270" cy="68" r="8" fill="#e07070" fill-opacity="0.6"/>
      <circle cx="340" cy="100" r="8" fill="#e07070" fill-opacity="0.6"/>
      <line x1="60" y1="95" x2="130" y2="70"/>
      <line x1="130" y1="70" x2="200" y2="105"/>
      <line x1="200" y1="105" x2="270" y2="68"/>
      <line x1="270" y1="68" x2="340" y2="100"/>
      <line x1="60" y1="95" x2="200" y2="105"/>
      <line x1="130" y1="70" x2="270" y2="68"/>
      <line x1="200" y1="105" x2="340" y2="100"/>
      <line x1="60" y1="95" x2="270" y2="68"/>
      <line x1="130" y1="70" x2="340" y2="100"/>
    </g>
    <text x="24" y="150" font-family="system-ui, sans-serif" font-size="14.5" fill="#baf3d2" fill-opacity="0.55">Scripted emails looping between strangers' inboxes</text>
    <text x="24" y="172" font-family="system-ui, sans-serif" font-size="13" fill="#e07070" fill-opacity="0.9">2 weeks of fake history, zero real engagement</text>
  </g>

  <text x="90" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Warmup: real emails</text>
  <text x="90" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff">or fake networks?</text>
  <g transform="translate(90, 380)">
    <rect width="150" height="44" rx="22" fill="#1ad379"/>
    <text x="75" y="29" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#0a2414">Klerk</text>
  </g>
</svg>
